name: Releases lib

on:
  workflow_dispatch:

jobs:
  releases-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      # `npm publish` rather than `bun publish`: bun ignores the token in ~/.npmrc and falls
      # through to its interactive browser login, which in CI blocks until the step times out.
      # npm reads the same file (a `npm whoami` against it authenticated fine) and, having no
      # interactive fallback, fails immediately and legibly when the token is wrong.
      #
      # The .npmrc goes in HOME, never in dist/, so the token cannot be packed into the tarball.
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          cd dist && npm publish
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}
